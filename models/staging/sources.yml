version: 2

sources:
  - name: silverscreen
    database: silverscreen
    schema: raw
    tables:
      - name: movie_catalog
        description: Raw data for movie catalogue containing detailed information about movies released in 2024 and rented out by “Silver Screen”.
        columns:
          - name: movie_id
            description: Unique identifier for each movie, often composed of a combination of studio, year, and a unique code.
            tests:
              - not_null
              - unique
          - name: movie_title
            description: Title of the movie.
          - name: release_date
            description: The official release date of the movie in format 'DD.MM.YYYY'.
          - name: genre
            description: Genre category of the movie, describing the type of content.
          - name: country
            description: The country where the movie was produced.
          - name: studio
            description: The production studio responsible for making the movie.
          - name: budget
            description: The production budget of the movie, typically in dollars.
          - name: director
            description: Director(s) of the movie.
          - name: rating
            description: The movie's age rating, describing the appropriate audience (e.g., PG, R).
          - name: minutes
            description: Runtime of the movie in minutes.

      - name: invoices
        description: Raw data representing the invoices issued for showing a specific movie at various theater locations during different months. Data was passed by “Silver Screen” accountants.
        columns:
          - name: movie_id
            description: Unique identifier for each movie linked to movie_catalogue.movie_id.
            tests:
              - not_null
          - name: invoice_id
            description: A unique identifier for each invoice issued for a specific movie at a specific location during a particular month.
            tests:
              - not_null
          - name: month
            description: Month in which the invoice was issue in format 'DD.MM.YYYY'.
          - name: location_id
            description: Identifier for the cinema location that broadcasted the movie either 'NJ_001', 'NJ_002' or 'NJ_003'.
          - name: studio
            description: The production studio responsible for the movie, such as Pixar, Marvel Studios, etc. 
          - name: release_date
            description: The official release date of the movie, when it was first available to the public in theaters. In format 'DD.MM.YYYY'.
          - name: weekly_price
            description: The weekly price charged for showing the movie at the specific location.
          - name: total_invoice_sum
            description: The total sum of the invoice for the week, typically calculated as the weekly_price multiplied by the number of weeks or total shows.

      - name: nj_001
        description: Raw transaction-level ticket sales data for location NJ_001 (timestamp-based granularity requiring extraction of month and aggregation by month and movie_id).
        columns:
          - name: timestamp
            description: The date and time the transaction occurred, formatted as 'YYYY-MM-DD'.
          - name: transaction_id
            description: A unique alphanumeric identifier assigned to each transaction. This ensures each transaction is uniquely identified.
            tests:
              - not_null
              - unique
          - name: movie_id
            description: A unique identifier for the movie being viewed in the transaction, usually tied to the movie's ID.
          - name: ticket_amount
            description: The number of tickets purchased in this particular transaction.
          - name: price
            description: The price per ticket for the transaction. This is the cost of a single ticket.
          - name: transaction_total
            description: The total amount of money spent in the transaction, calculated as ticket_amount * price.
          - name: is_discounted
            description: A boolean value indicating whether the transaction involved a discounted ticket. TRUE for discounted, FALSE for full price.
          - name: is_3d
            description: A boolean value indicating whether the movie shown was in 3D. TRUE if the movie was in 3D, FALSE if not.

      - name: nj_002
        description: Daily aggregated ticket sales data for location NJ_002 (date-based granularity requiring additional transformation into a monthly view).
        columns:
          - name: date
            description: The date of the ticket sales transaction, formatted as 'YYYY-MM-DD'. This represents the day for which ticket sales are recorded.
          - name: movie_id
            description: A unique identifier for the movie being sold, typically tied to a movie's ID.
          - name: ticked_amount
            description: The number of tickets sold on the given day.
          - name: ticket_price
            description: The price per ticket sold on that particular day.
          - name: total_earned
            description: The total revenue earned from ticket sales on the specified date, calculated as ticket_amount * ticket_price.

      - name: nj_003
        description: Raw transaction-level product sales data for location NJ_003 (timestamp-based granularity requiring filtering for product type 'ticket' and extracting embedded movie_id from the details column).
        columns:
          - name: timestamp
            description: The date and time when the transaction occurred, formatted as 'YYYY-MM-DD'.
          - name: transaction_id
            description: A unique alphanumeric identifier assigned to each transaction, ensuring that each transaction can be uniquely identified.
          - name: product_type
            description: The type of product involved in the transaction, which could be a ticket, drink, snack, etc.
          - name: details
            description: For tickets, this indicates the movie being viewed, represented by the movie_id. For other products, it remains empty or unspecified.
          - name: amount
            description: The quantity of the product purchased in the transaction
          - name: price
            description: The price per unit of the product sold. This is the cost of one item, whether it's a ticket, drink, or snack.
          - name: total_value
            description: The total amount spent in the transaction, calculated as amount * price.